<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo dealersite</title>
<style>
  body { margin: 0; font-family: Georgia, serif; background: #faf7f2; color: #222; }
  header { background: #7a1f1f; color: #fff; padding: 18px 24px; font-size: 22px; font-weight: bold; }
  nav { background: #5c1616; padding: 8px 24px; font-size: 14px; color: #f3d9d9; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  .embed-box { background: #fff; border-radius: 6px; padding: 8px; }
  pre { background: #222; color: #eee; padding: 14px; border-radius: 6px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<header>Demo Fietsenwinkel</header>
<nav>Home · Fietsen · Werkplaats · <b>VanMoof leasen</b> · Contact</nav>
<main>
  <h2>VanMoof leasen</h2>
  <p>Simulatie van een dealerwebsite met het formulier ingebed (dealer-ID FLHDE0393).</p>

  <div class="embed-box">
    <!-- ===== Begin embedcode Fietslease Holland ===== -->
    <iframe id="flh-vanmoof" src="/?dealerid=FLHDE0393"
            style="width:100%;border:0;min-height:900px;display:block" title="VanMoof leasen via Fietslease Holland" loading="lazy"></iframe>
    <script>
      (function () {
        var f = document.getElementById("flh-vanmoof"), queued = false;
        function viewport() {
          queued = false;
          var r = f.getBoundingClientRect();
          f.contentWindow && f.contentWindow.postMessage({ type: "flh-viewport", top: r.top, vh: window.innerHeight }, "*");
        }
        function queue() { if (!queued) { queued = true; requestAnimationFrame(viewport); } }
        window.addEventListener("message", function (e) {
          if (e.source !== f.contentWindow || !e.data) return;
          if (e.data.type === "flh-height") { f.style.minHeight = "0"; f.style.height = e.data.height + "px"; queue(); }
          if (e.data.type === "flh-scroll-top") f.scrollIntoView({ behavior: "smooth" });
        });
        window.addEventListener("scroll", queue, { passive: true });
        window.addEventListener("resize", queue);
        f.addEventListener("load", queue);
      })();
    </script>
    <!-- ===== Einde embedcode ===== -->
  </div>
</main>
</body>
</html>
